# Same as config/manager/manager.yaml but uses a cluster-local operator image
# (kind load / k3d image import). No GHCR pull.
apiVersion: v1
kind: Namespace
metadata:
  name: muxcore-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: muxcore-operator
  namespace: muxcore-system
  labels:
    app.kubernetes.io/name: muxcore-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: muxcore-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: muxcore-operator
    spec:
      serviceAccountName: muxcore-operator
      containers:
        - name: manager
          image: muxcore-operator:v0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=false
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          ports:
            - name: health
              containerPort: 8081
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
