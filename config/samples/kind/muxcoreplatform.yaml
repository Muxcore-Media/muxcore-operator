# Kind / k3d soak sample — muxcored only (no sidecar image pulls).
# Load muxcored into the cluster before soak (see scripts/soak-operator-kind.sh).
apiVersion: muxcore.media/v1alpha1
kind: MuxCorePlatform
metadata:
  name: minimal-local
  namespace: muxcore
spec:
  insecureDisableTLS: true
  coreImage: muxcored:v0.6.13
  imagePullPolicy: IfNotPresent
  modules: []
