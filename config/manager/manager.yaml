apiVersion: v1
kind: Namespace
metadata:
  name: muxcore-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: muxcore-operator
  namespace: muxcore-system
  labels:
    app.kubernetes.io/name: muxcore-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: muxcore-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: muxcore-operator
    spec:
      serviceAccountName: muxcore-operator
      securityContext:
        runAsNonRoot: true
      containers:
        - name: manager
          image: git.zem.systems/muxcore/muxcore-operator:v0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=false
            - --watch-namespace=muxcore
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=127.0.0.1:8080
          ports:
            - name: health
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
