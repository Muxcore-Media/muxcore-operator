apiVersion: v1
kind: ServiceAccount
metadata:
  name: muxcore-operator
  namespace: muxcore-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: muxcore-operator
rules:
  - apiGroups: [muxcore.media]
    resources: [muxcoreplatforms]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [muxcore.media]
    resources: [muxcoreplatforms/status]
    verbs: [get, update, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: muxcore-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: muxcore-operator
subjects:
  - kind: ServiceAccount
    name: muxcore-operator
    namespace: muxcore-system
