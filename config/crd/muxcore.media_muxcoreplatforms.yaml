apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: muxcoreplatforms.muxcore.media
spec:
  group: muxcore.media
  names:
    kind: MuxCorePlatform
    listKind: MuxCorePlatformList
    plural: muxcoreplatforms
    shortNames:
      - mcp
    singular: muxcoreplatform
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Modules
          type: integer
          jsonPath: .status.readyModules
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                insecureDisableTLS:
                  type: boolean
                coreImage:
                  type: string
                  default: git.zem.systems/muxcore/muxcored:v0.5.4
                meshAddr:
                  type: string
                meshTLSSecret:
                  type: string
                imagePullPolicy:
                  type: string
                imagePullSecrets:
                  type: array
                  items:
                    type: string
                defaultResources:
                  type: object
                  properties:
                    requests:
                      type: object
                      additionalProperties:
                        type: string
                    limits:
                      type: object
                      additionalProperties:
                        type: string
                modules:
                  type: array
                  x-kubernetes-validations:
                    - rule: self.all(m, m.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'))
                      message: module names must be DNS-1123 labels
                    - rule: self.all(m, m.name != 'muxcored')
                      message: muxcored is reserved for the core Deployment
                    - rule: self.size() == self.map(m, m.name).size()
                      message: module names must be unique
                  items:
                    type: object
                    required: [name, image]
                    properties:
                      name:
                        type: string
                      image:
                        type: string
                      args:
                        type: array
                        items:
                          type: string
                      env:
                        type: object
                        additionalProperties:
                          type: string
                      envFromSecret:
                        type: string
                      port:
                        type: integer
                        format: int32
                      httpPort:
                        type: integer
                        format: int32
                      httpServicePort:
                        type: integer
                        format: int32
                      grpcPort:
                        type: integer
                        format: int32
                      healthPath:
                        type: string
                      volume:
                        type: object
                        properties:
                          claimName:
                            type: string
                          size:
                            type: string
                          mountPath:
                            type: string
                          storageClassName:
                            type: string
                      resources:
                        type: object
                        properties:
                          requests:
                            type: object
                            additionalProperties:
                              type: string
                          limits:
                            type: object
                            additionalProperties:
                              type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                readyModules:
                  type: integer
                  format: int32
                desiredModules:
                  type: integer
                  format: int32
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
